<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- الصفحة عربي/إنجليزي داخليًا — نمنع الترجمة الآلية للمتصفح لأنها بتشوّه النصوص العربية -->
  <meta name="google" content="notranslate">
  <title>HyMotion — Dashboard</title>
  <link href="/shared/vendor/fonts/cairo.css" rel="stylesheet">
  <link rel="stylesheet" href="/shared/vendor/tabler-icons/tabler-icons.min.css">
  <!--
  Role-aware gym dashboard — permission-gated widgets, real APIs only.
  Hierarchy: Live status strip → Today KPIs → Quick Actions → Today at the gym (+ Prepare-Gym setup) → Finance (+ Latest activity) → Business → Needs attention.
  Expenses, profit, and margin are shown only when the cash-expense capability and permission exist.
-->
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --c900: #0D0D0D;
      --c800: #1A1A1A;
      --c700: #2A2A2A;
      --c600: #3A3A3A;
      --c500: #4A4A4A;
      --c400: #6B6B6B;
      --c300: #8C8C8C;
      --c200: #B0B0B0;
      --c100: #D4D4D4;
      --c50: #F0F0F0;
      --l600: #5EAF00;
      --l500: #7ACC00;
      --l400: #A0E040;
      --l300: #BEEC73;
      --l200: #D8F5A6;
      --l100: #EDFCD8;
      --lglow: rgba(160, 224, 64, 0.25);
      --t700: #0A4D4D;
      --t600: #0D6B6B;
      --t500: #148F8F;
      --t400: #3DB5B5;
      --suc500: #22C55E;
      --suc100: #DCFCE7;
      --wrn500: #F59E0B;
      --wrn100: #FEF3C7;
      --dng500: #EF4444;
      --dng100: #FEE2E2;
      --inf500: #3B82F6;
      --inf100: #DBEAFE;
      --lbg: #FAFAFA;
      --ls1: #FFF;
      --ls2: #F5F5F5;
      --ls3: #EBEBEB;
      --ltp: #1A1A1A;
      --lts: #4A4A4A;
      --ltt: #8C8C8C;
      --lbd: #D4D4D4;
      --dtp: #F0F0F0;
      --dts: #B0B0B0;
      --dtt: #6B6B6B;
      --dbd: #4A4A4A;
      --fd: 'Cairo', sans-serif;
      --fb: 'Cairo', sans-serif;
      --fa: 'Cairo', sans-serif;
      --rsm: 6px;
      --rmd: 10px;
      --rlg: 16px;
      --rxl: 24px;
      --rpl: 9999px;
      --sh1: 0 1px 2px rgba(0, 0, 0, .06);
      --sh2: 0 2px 8px rgba(0, 0, 0, .08);
      --sh3: 0 4px 16px rgba(0, 0, 0, .12);
      --tf: 150ms ease;
      --tb: 250ms ease;
      --sidebar-w: 240px;
    }

    html,
    body {
      height: 100%
    }

    body {
      font-family: var(--fb);
      background: var(--lbg);
      color: var(--ltp);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden
    }

    [dir="rtl"] body {
      font-family: var(--fa)
    }

    .app {
      display: flex;
      height: 100vh
    }

    .sidebar {
      width: var(--sidebar-w);
      background: var(--c900);
      color: var(--dtp);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 100;
      overflow-y: auto;
      overflow-x: hidden;
    }

    [dir="rtl"] .sidebar {
      left: auto;
      right: 0
    }

    .sb-hdr {
      padding: 20px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--c700)
    }

    .sb-hdr svg {
      width: 32px;
      height: 32px;
      flex-shrink: 0
    }

    .sb-hdr span {
      font-family: var(--fd);
      font-weight: 700;
      font-size: 16px;
      color: var(--l400);
      letter-spacing: -.3px
    }

    .sb-nav {
      padding: 8px 0;
      flex: 1
    }

    .sb-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--tf);
      border-left: 3px solid transparent;
      color: var(--c300);
      text-decoration: none;
    }

    .sb-item:hover {
      background: var(--c700)
    }

    .sb-item.act {
      background: rgba(160, 224, 64, .08);
      color: var(--l400);
      border-left-color: var(--l500)
    }

    .sb-item i {
      font-size: 18px;
      opacity: .7;
      width: 20px;
      text-align: center
    }

    .sb-ft {
      padding: 16px;
      border-top: 1px solid var(--c700);
      display: flex;
      align-items: center;
      gap: 12px
    }

    .sb-ft-info {
      flex: 1;
      min-width: 0
    }

    .sb-ft-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .sb-ft-role {
      font-size: 11px;
      color: var(--c400)
    }

    .sb-logout {
      background: none;
      border: none;
      color: var(--c400);
      cursor: pointer;
      font-size: 18px;
      padding: 4px
    }

    .sb-logout:hover {
      color: var(--dng500)
    }

    .av-sm {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--fd);
      font-weight: 700;
      font-size: 11px;
      flex-shrink: 0;
      text-transform: uppercase;
      background: var(--l300);
      color: var(--c900)
    }

    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh
    }

    [dir="rtl"] .main {
      margin-left: 0;
      margin-right: var(--sidebar-w)
    }

    .topbar {
      height: 60px;
      background: var(--ls1);
      border-bottom: 1px solid var(--ls3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .tb-left {
      display: flex;
      align-items: center;
      gap: 16px
    }

    .tb-breadcrumb {
      font-family: var(--fd);
      font-size: 14px;
      font-weight: 600;
      color: var(--lts)
    }

    .tb-right {
      display: flex;
      align-items: center;
      gap: 16px
    }

    .tb-gym-name {
      font-family: var(--fd);
      font-size: 13px;
      font-weight: 600;
      color: var(--lts)
    }

    .tb-gym-name-ar {
      font-family: var(--fa);
      font-size: 12px;
      color: var(--ltt);
      direction: rtl
    }

    .content {
      padding: 24px 32px;
      flex: 1
    }

    .dash-intro {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px
    }

    .dash-eyebrow {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--l600)
    }

    .dash-intro h1 {
      font-family: var(--fd);
      font-size: 28px;
      line-height: 1.15;
      margin-top: 4px
    }

    .dash-intro p {
      font-size: 14px;
      color: var(--ltt);
      margin-top: 5px
    }

    .dash-intro-meta {
      font-size: 12px;
      color: var(--ltt);
      white-space: nowrap
    }

    .widget-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
    }

    .dash-widget {
      grid-column: span 6;
      background: var(--ls1);
      border: 1px solid var(--ls3);
      border-radius: var(--rlg);
      box-shadow: var(--sh1);
      padding: 18px 20px;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .dash-widget.span-12 {
      grid-column: span 12
    }

    .dash-widget.span-6 {
      grid-column: span 6
    }

    .dash-widget.span-8 {
      grid-column: span 8
    }

    .dash-widget.span-4 {
      grid-column: span 4
    }

    .dash-widget[data-widget="kpis"],
    .dash-widget[data-widget="quick-actions"] {
      grid-column: span 12
    }

    .dash-widget[data-widget="kpis"] {
      min-height: 0;
      padding: 16px 18px
    }

    .dash-widget-hdr {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px
    }

    .dash-widget-title {
      font-family: var(--fd);
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .dash-widget-title i {
      color: var(--l600)
    }

    .dash-widget-sub {
      font-size: 12px;
      color: var(--ltt);
      margin-top: 2px
    }

    .dash-widget-body {
      flex: 1;
      min-width: 0
    }

    .dash-section-label {
      grid-column: 1/-1;
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 6px 2px 0
    }

    .dash-section-label span {
      font-family: var(--fd);
      font-size: 15px;
      font-weight: 800
    }

    .dash-section-label small {
      font-size: 12px;
      color: var(--ltt)
    }

    .dash-kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px
    }

    .dash-kpi-row.compact {
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px
    }

    .dash-kpi {
      background: var(--ls2);
      border-radius: var(--rmd);
      padding: 12px 14px;
      cursor: default
    }

    .dash-kpi .lbl {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: var(--ltt);
      margin-bottom: 4px
    }

    .dash-kpi strong {
      font-family: var(--fd);
      font-size: 22px;
      font-weight: 700;
      line-height: 1.15;
      display: block
    }

    .dash-kpi-row.compact .dash-kpi strong {
      font-size: 18px
    }

    .dash-kpi strong.ok {
      color: var(--suc500)
    }

    .dash-kpi .sub {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      color: var(--lts)
    }

    .dash-exec-period {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px
    }

    .dash-exec-period-label {
      font-size: 13px;
      color: var(--ltt)
    }

    .dash-exec-kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 18px
    }

    .dash-exec-kpi {
      background: var(--ls2);
      border: 1px solid var(--ls3);
      border-radius: var(--rlg);
      padding: 14px 16px;
      min-height: 108px;
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .dash-exec-kpi.is-warn {
      border-color: color-mix(in srgb, var(--wrn500) 45%, var(--ls3))
    }

    .dash-exec-kpi.is-muted {
      opacity: .92
    }

    .dash-exec-kpi .lbl {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .35px;
      color: var(--ltt)
    }

    .dash-exec-kpi .val {
      font-family: var(--fd);
      font-size: 24px;
      font-weight: 800;
      line-height: 1.1;
      color: var(--ltp)
    }

    .dash-exec-kpi .val.unavailable {
      font-size: 16px;
      font-weight: 700;
      color: var(--ltt)
    }

    .dash-exec-kpi .sub {
      font-size: 12px;
      color: var(--lts);
      line-height: 1.35
    }

    .dash-exec-kpi .hint {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      color: var(--ltt);
      line-height: 1.45;
      font-style: normal
    }

    .dash-exec-kpi .hint strong {
      color: var(--lts);
      font-weight: 600
    }

    .dash-exec-kpi .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--ltt)
    }

    .dash-exec-kpi .status::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--suc500);
      flex-shrink: 0
    }

    .dash-exec-kpi .status.warn::before {
      background: var(--wrn500)
    }

    .dash-exec-kpi .status.unavailable::before {
      background: var(--ltt)
    }

    .dash-exec-section {
      margin-top: 18px
    }

    .dash-exec-section>h3 {
      font-family: var(--fd);
      font-size: 12px;
      font-weight: 800;
      color: var(--lts);
      letter-spacing: .2px;
      margin: 0 0 10px
    }

    .dash-exec-owed {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px
    }

    .dash-exec-owed .dash-exec-kpi {
      min-height: 96px
    }

    .dash-exec-attn {
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .dash-exec-attn-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: var(--rmd);
      border: 1px solid color-mix(in srgb, var(--wrn500) 30%, var(--ls3));
      background: color-mix(in srgb, var(--wrn500) 8%, var(--ls2))
    }

    .dash-exec-attn-item p {
      margin: 4px 0 0;
      font-size: 12px;
      color: var(--lts);
      line-height: 1.4
    }

    .dash-exec-attn-item strong {
      font-size: 13px
    }

    .dash-exec-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px
    }

    .dash-exec-links a {
      font-size: 12px;
      font-weight: 700;
      color: var(--l600);
      text-decoration: none;
      padding: 6px 10px;
      border-radius: var(--rmd);
      border: 1px solid var(--ls3);
      background: var(--ls1)
    }

    .dash-exec-links a:hover {
      border-color: var(--l500)
    }

    .dash-exec-kpis-hero {
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr))
    }

    .dash-exec-kpi-cost .val {
      font-size: 22px
    }

    .dash-profit-bridge {
      display: flex;
      flex-direction: column;
      gap: 0;
      border: 1px solid var(--ls3);
      border-radius: var(--rmd);
      background: var(--ls1);
      overflow: hidden
    }

    .dash-profit-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--ls3);
      font-size: 13px
    }

    .dash-profit-row:last-child {
      border-bottom: 0
    }

    .dash-profit-row.is-total {
      background: var(--ls2);
      font-weight: 700
    }

    .dash-profit-row strong {
      font-family: var(--fd);
      font-size: 14px
    }

    .dash-exec-callout {
      margin: 10px 0 0;
      padding: 10px 12px;
      border-radius: var(--rmd);
      border: 1px solid color-mix(in srgb, var(--wrn500) 35%, var(--ls3));
      background: color-mix(in srgb, var(--wrn500) 8%, var(--ls2));
      font-size: 12px;
      color: var(--lts);
      line-height: 1.45
    }

    .dash-exec-glossary {
      margin: 0 0 16px;
      padding: 12px 14px;
      border: 1px solid var(--ls3);
      border-radius: var(--rmd);
      background: var(--ls1)
    }

    .dash-exec-glossary>summary {
      cursor: pointer;
      font-family: var(--fd);
      font-size: 13px;
      font-weight: 800;
      color: var(--ltp);
      list-style: none
    }

    .dash-exec-glossary>summary::-webkit-details-marker {
      display: none
    }

    .dash-exec-glossary>summary::before {
      content: '▸ ';
      color: var(--l600)
    }

    .dash-exec-glossary[open]>summary::before {
      content: '▾ '
    }

    .dash-exec-glossary-list {
      margin: 12px 0 0;
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .dash-exec-glossary-list dt {
      font-size: 12px;
      font-weight: 700;
      color: var(--ltp)
    }

    .dash-exec-glossary-list dd {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--lts);
      line-height: 1.45
    }

    .dash-exec-glossary-foot {
      margin: 12px 0 0
    }

    .dash-chart-note {
      margin-top: 8px;
      font-size: 12px;
      color: var(--ltt)
    }

    .dash-muted {
      color: var(--ltt);
      font-size: 13px
    }

    .dash-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px
    }

    .dash-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: var(--fd);
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: var(--rmd);
      border: 1px solid var(--ls3);
      background: var(--ls2);
      color: var(--lts);
      text-decoration: none;
      cursor: pointer;
    }

    .dash-btn.primary {
      background: var(--l500);
      border-color: var(--l500);
      color: var(--c900)
    }

    .dash-btn.secondary {
      background: var(--ls1);
      border: 2px solid var(--ls3);
      color: var(--ltp)
    }

    .dash-btn.secondary:hover {
      border-color: var(--l500)
    }

    .dash-btn.ghost {
      background: transparent
    }

    .dash-btn:disabled {
      opacity: .55;
      cursor: not-allowed
    }

    .dash-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0
    }

    .dash-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--ls3);
      font-size: 13px;
      flex-wrap: wrap
    }

    .dash-list li:last-child {
      border-bottom: none
    }

    .dash-list-main {
      font-weight: 600;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .dash-list a.dash-list-main {
      color: inherit;
      text-decoration: none
    }

    .dash-list a.dash-list-main:hover {
      color: var(--l600)
    }

    .dash-list-meta {
      color: var(--ltt);
      font-size: 12px;
      flex-shrink: 0;
      font-family: var(--fd);
      white-space: nowrap
    }

    .dash-exp-main {
      flex: 1;
      min-width: 140px;
      display: flex;
      flex-direction: column;
      gap: 2px
    }

    .dash-exp-sub {
      font-size: 12px;
      color: var(--ltt);
      font-weight: 500
    }

    .dash-exp-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0
    }

    .dash-link {
      display: inline-block;
      margin-top: 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--l600);
      text-decoration: none
    }

    .dash-link:hover {
      text-decoration: underline
    }

    .dash-quick {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px
    }

    .dash-quick-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 112px;
      padding: 22px 16px;
      border-radius: var(--rlg);
      border: 1px solid var(--ls3);
      background: var(--ls2);
      text-decoration: none;
      color: var(--ltp);
      font-family: var(--fd);
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      transition: border-color var(--tf), background var(--tf);
    }

    .dash-quick-item:hover {
      border-color: var(--l500);
      background: var(--l100)
    }

    .dash-quick-ico {
      width: 48px;
      height: 48px;
      border-radius: var(--rmd);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dash-quick-ico i {
      font-size: 24px;
      line-height: 1
    }

    .dash-quick-item.qa-member .dash-quick-ico {
      background: var(--inf100);
      color: var(--inf500)
    }

    .dash-quick-item.qa-checkin .dash-quick-ico {
      background: var(--l100);
      color: var(--l600)
    }

    .dash-quick-item.qa-sale .dash-quick-ico {
      background: var(--suc100);
      color: var(--suc500)
    }

    .dash-quick-item.qa-collect .dash-quick-ico {
      background: var(--wrn100);
      color: var(--wrn500)
    }

    .dash-quick-item.qa-trial .dash-quick-ico {
      background: var(--l100);

    .dash-quick-item.qa-shift .dash-quick-ico {

    }

    .dash-quick-item.qa-close .dash-quick-ico {

    }

    .dash-quick-item.qa-refund .dash-quick-ico {

    }

    .dash-quick-item.qa-offer .dash-quick-ico {
      background: var(--suc100);

    }

    .dash-quick-item.qa-freeze .dash-quick-ico {

      color: var(--inf500)

    }

    .dash-quick.is-saving {

    .dash-qa-tile {

      min-width: 0;
      display: flex

    .dash-qa-tile .dash-quick-item {

      height: 100%

    .dash-qa-remove {
      position: absolute;
      top: 6px;
      inset-inline-end: 6px;
      width: 24px;
      height: 24px;
      border: none;
      border-radius: var(--rpl);
      background: var(--ls1);
      color: var(--lts);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--sh1);
      opacity: 1;

      .dash-qa-remove:focus {

    .dash-qa-remove:hover {
      background: var(--dng100);
      color: var(--dng500)
    }

    .dash-qa-manage-link {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      font-family: var(--fd);
      font-size: 12px;
      font-weight: 700;
      color: var(--l600);
    }

    .dash-qa-manage-link:hover {
      text-decoration: underline
    }

    .dash-qa-manage-below {
      display: inline-block;
      margin-top: 10px
    }

    .dash-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(13, 13, 13, .45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 400;
      padding: 16px;
    }

    .dash-modal-overlay[hidden] {
      display: none
    }

    .dash-modal {
      background: var(--ls1);
      border-radius: var(--rlg);
      width: 100%;
      max-width: 420px;
      max-height: min(80vh, 640px);
      overflow: auto;
      box-shadow: var(--sh3);
      padding: 18px 20px;
    }

    .dash-modal-wide {
      max-width: 520px
    }

    .dash-modal-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px
    }

    .dash-modal-hdr h3 {
      font-family: var(--fd);
      font-size: 16px;
      font-weight: 700
    }

    .dash-modal-close {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: var(--rmd);
      background: var(--ls2);
      cursor: pointer;
      color: var(--lts);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dash-qa-section {
      font-family: var(--fd);
      font-size: 13px;
      font-weight: 700;
      margin: 12px 0 8px
    }

    .dash-qa-pick-list {
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .dash-qa-pick {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: start;
      padding: 10px 12px;
      border-radius: var(--rmd);
      border: 1px solid var(--ls3);
      background: var(--ls2);
      cursor: pointer;
      font-family: var(--fd);
      font-size: 14px;
      font-weight: 600;
      color: var(--ltp);
    }

    .dash-qa-pick:hover {
      border-color: var(--l500);
      background: var(--l100)
    }

    .dash-qa-pick .dash-quick-ico {
      width: 36px;
      height: 36px;
      flex-shrink: 0
    }

    .dash-qa-pick .qa-member,
    .dash-quick-ico.qa-member {
      background: var(--inf100);
      color: var(--inf500)
    }

    .dash-qa-pick .qa-checkin,
    .dash-quick-ico.qa-checkin {
      background: var(--l100);
      color: var(--l600)
    }

    .dash-qa-pick .qa-sale,
    .dash-quick-ico.qa-sale {
      background: var(--suc100);
      color: var(--suc500)
    }

    .dash-qa-pick .qa-collect,
    .dash-quick-ico.qa-collect {
      background: var(--wrn100);
      color: var(--wrn500)
    }

    .dash-qa-pick .qa-trial,
    .dash-quick-ico.qa-trial {
      background: var(--l100);
      color: var(--l600)
    }

    .dash-qa-pick .qa-remind,
    .dash-quick-ico.qa-remind {
      background: var(--wrn100);
      color: var(--wrn500)
    }

    .dash-qa-pick .qa-shift,
    .dash-quick-ico.qa-shift {
      background: var(--inf100);
      color: var(--inf500)
    }

    .dash-qa-pick .qa-close,
    .dash-quick-ico.qa-close {
      background: var(--dng100);
      color: var(--dng500)
    }

    .dash-qa-pick .qa-refund,
    .dash-quick-ico.qa-refund {
      background: var(--dng100);
      color: var(--dng500)
    }

    .dash-qa-pick .qa-offer,
    .dash-quick-ico.qa-offer {
      background: var(--suc100);
      color: var(--suc500)
    }

    .dash-qa-pick .qa-freeze,
    .dash-quick-ico.qa-freeze {
      background: var(--inf100);
      color: var(--inf500)
    }

    .dash-qa-pick .qa-class,
    .dash-quick-ico.qa-class {
      background: var(--l100);
      color: var(--l600)
    }

    .dash-qa-rows {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .dash-qa-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid var(--ls3);
      border-radius: var(--rmd);
      background: var(--ls2);
    }

    .dash-qa-row-label {
      flex: 1;
      font-family: var(--fd);
      font-size: 14px;
      font-weight: 600
    }

    .dash-qa-row-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0
    }

    .dash-qa-row-actions .dash-btn {
      padding: 6px 8px
    }

    .dash-toast {
      position: fixed;
      bottom: 24px;
      inset-inline-end: 24px;
      z-index: 500;
      display: none;
      padding: 10px 16px;
      border-radius: var(--rmd);
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--sh2);
      max-width: min(420px, calc(100vw - 32px));
    }

    .dash-toast.show {
      display: block
    }

    .dash-toast.ok {
      background: var(--suc100);
      color: var(--suc500)
    }

    .dash-toast.err {
      background: var(--dng100);
      color: var(--dng500)
    }

    .dash-breakdown {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 8px;
      margin-top: 12px
    }

    .dash-breakdown>div {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 10px;
      border: 1px solid var(--ls3);
      border-radius: var(--rsm);
      font-size: 12px
    }

    .dash-breakdown strong {
      font-family: var(--fd)
    }

    .dash-attention-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 8px
    }

    .dash-attention-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 11px 12px;
      border: 1px solid var(--ls3);
      border-radius: var(--rsm);
      color: inherit;
      text-decoration: none
    }

    .dash-attention-item:hover {
      border-color: var(--l500);
      background: var(--l100)
    }

    .dash-attention-item>.ti {
      font-size: 19px;
      color: var(--wrn500);
      flex-shrink: 0
    }

    .dash-attention-item span {
      flex: 1;
      font-size: 13px
    }

    .dash-attention-item strong {
      font-family: var(--fd);
      font-size: 13px
    }

    .dash-empty {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--ltt);
      padding: 12px 0
    }

    .dash-empty .ti {
      font-size: 20px;
      color: var(--suc500)
    }

    .dash-alert-list {
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .dash-alert {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: var(--rmd);
      border: 1px solid var(--ls3);
      background: var(--ls2);
      text-decoration: none;
      color: var(--ltp);
      transition: border-color var(--tf), background var(--tf);
    }

    .dash-alert:hover {
      border-color: var(--l500);
      background: var(--l100)
    }

    .dash-alert>.ti:first-child {
      font-size: 20px;
      color: var(--wrn500);
      flex-shrink: 0
    }

    .dash-alert-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px
    }

    .dash-alert-body strong {
      font-family: var(--fd);
      font-size: 13px
    }

    .dash-alert-body span {
      font-size: 12px;
      color: var(--ltt)
    }

    .dash-alert-chev {
      color: var(--ltt);
      font-size: 16px;
      flex-shrink: 0
    }

    [dir="rtl"] .dash-alert-chev {
      transform: scaleX(-1)
    }

    .dash-glance {
      display: flex;
      flex-wrap: wrap;
      gap: 8px
    }

    .dash-glance-chip {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: var(--rpl);
      background: var(--ls2);
      border: 1px solid var(--ls3);
      font-size: 12px;
      font-weight: 600;
      color: var(--lts);
    }

    .dash-chart-wrap {
      position: relative;
      height: 140px;
      margin-top: 10px
    }

    .dash-chart-skel {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 100%;
      padding: 8px 4px 4px
    }

    .dash-skel-bar {
      flex: 1;
      border-radius: 6px 6px 2px 2px;
      background: linear-gradient(90deg, var(--ls3) 25%, var(--ls2) 50%, var(--ls3) 75%);
      background-size: 200% 100%;
      animation: dash-skel 1.1s linear infinite;
    }

    @keyframes dash-skel {
      to {
        background-position: -200% 0
      }
    }

    .dash-chart-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      padding: 12px
    }

    .dash-chart-hdr {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      font-family: var(--fd);
      font-size: 13px;
      font-weight: 700
    }

    #financePeriodSeg {
      max-width: 100%;
      overflow-x: auto
    }

    .dash-seg {
      display: inline-flex;
      border: 1px solid var(--ls3);
      border-radius: var(--rmd);
      overflow: hidden;
      margin-inline-start: auto
    }

    .dash-seg-btn {
      border: none;
      background: var(--ls2);
      padding: 4px 10px;
      font-family: var(--fd);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      color: var(--lts)
    }

    .dash-seg-btn.act {
      background: var(--l500);
      color: var(--c900)
    }

    .dash-custom-range {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap
    }

    .dash-custom-range input {
      max-width: 145px;
      border: 1px solid var(--ls3);
      border-radius: var(--rsm);
      padding: 7px 8px;
      background: var(--ls1);
      color: var(--ltp)
    }

    .dash-local-err {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px
    }

    .dash-local-err p {
      color: var(--ltt);
      font-size: 13px
    }

    .occ-row {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap
    }

    .occ-gauge {
      position: relative;
      width: 120px;
      height: 120px;
      flex-shrink: 0
    }

    .occ-gauge svg {
      display: block;
      width: 120px;
      height: 120px;
      transform: rotate(-90deg)
    }

    .occ-gauge .track {
      fill: none;
      stroke: var(--ls3);
      stroke-width: 10
    }

    .occ-gauge .fill {
      fill: none;
      stroke: var(--suc500);
      stroke-width: 10;
      stroke-linecap: round;
      stroke-dasharray: 301.593;
      stroke-dashoffset: 301.593
    }

    .occ-gauge.ok .fill {
      stroke: var(--suc500)
    }

    .occ-gauge.busy .fill {
      stroke: var(--wrn500)
    }

    .occ-gauge.full .fill,
    .occ-gauge.over .fill {
      stroke: var(--dng500)
    }

    .occ-gauge.mute .fill {
      stroke: var(--ls3)
    }

    .occ-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none
    }

    .occ-pct {
      font-family: var(--fd);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -.03em;
      line-height: 1
    }

    .occ-pct small {
      font-size: 13px;
      font-weight: 600;
      color: var(--ltt)
    }

    .occ-pct-lbl {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--ltt);
      margin-top: 2px
    }

    .occ-copy {
      flex: 1;
      min-width: 140px
    }

    .occ-status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px
    }

    .occ-status strong {
      font-family: var(--fd);
      font-size: 16px;
      font-weight: 700
    }

    .occ-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--suc500);
      box-shadow: 0 0 0 4px var(--suc100);
      flex-shrink: 0
    }

    .occ-dot.busy {
      background: var(--wrn500);
      box-shadow: 0 0 0 4px var(--wrn100)
    }

    .occ-dot.full,
    .occ-dot.over {
      background: var(--dng500);
      box-shadow: 0 0 0 4px var(--dng100)
    }

    .occ-dot.mute {
      background: var(--ltt);
      box-shadow: 0 0 0 4px var(--ls3)
    }

    .occ-bar {
      height: 8px;
      background: var(--ls2);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px
    }

    .occ-bar>i {
      display: block;
      height: 100%;
      border-radius: 999px;
      background: var(--suc500)
    }

    .occ-bar.busy>i {
      background: var(--wrn500)
    }

    .occ-bar.full>i,
    .occ-bar.over>i {
      background: var(--dng500)
    }

    @media(max-width:900px) {

      .dash-widget,
      .dash-widget.span-6,
      .dash-widget.span-12 {
        grid-column: span 12
      }
    }

    @media(max-width:768px) {
      .sidebar {
        transform: translateX(-100%)
      }

      [dir="rtl"] .sidebar {
        transform: translateX(100%)
      }

      .sidebar.open {
        transform: translateX(0)
      }

      .main {
        margin-left: 0
      }

      [dir="rtl"] .main {
        margin-right: 0
      }

      .content {
        padding: 16px
      }

      .topbar {
        padding: 0 16px
      }

      .dash-intro {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px
      }

      .dash-intro h1 {
        font-size: 23px
      }

      .mob-toggle {
        display: flex !important
      }

      .dash-quick {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }

      .dash-chart-hdr #financePeriodSeg {
        width: 100%;
        margin-inline-start: 0
      }
    }

    .mob-toggle {
      display: none !important;
      width: 36px;
      height: 36px;
      align-items: center;
      justify-content: center;
      border: none;
      background: var(--ls2);
      border-radius: var(--rmd);
      cursor: pointer;
      font-size: 18px;
      color: var(--lts)
    }

    /* ============================================================
       Operations-room refresh (v2): status strip, merged ops card,
       finance grid with flags, activity feed. Same tokens, quiet.
       ============================================================ */
    .dash-intro-end {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap
    }

    .dash-intro-cta:empty {
      display: none
    }

    .dash-cta-btn {
      height: 40px;
      padding: 0 18px;
      border-radius: var(--rmd);
      background: var(--l500);
      border-color: var(--l500);
      color: #101503;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 10px rgba(122, 204, 0, .18)
    }

    .dash-cta-btn:hover {
      background: var(--l400);
      border-color: var(--l400)
    }

    /* — شريط الحالة المباشر — */
    .dash-widget.dash-statusbar {
      background: transparent;
      border: 0;
      box-shadow: none;
      padding: 0;
      gap: 0
    }

    .dash-statusbar-body {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      background: var(--ls1);
      border: 1px solid var(--ls3);
      border-radius: var(--rlg);
      padding: 9px 14px;
      font-size: 12px;
      color: var(--lts)
    }

    .dash-pulse {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-weight: 800;
      color: var(--l600);
      font-size: 11.5px
    }

    .dash-pulse i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--l500);
      animation: dash-pulse 2s infinite
    }

    @keyframes dash-pulse {
      0% { box-shadow: 0 0 0 0 rgba(122, 204, 0, .45) }
      70% { box-shadow: 0 0 0 7px rgba(122, 204, 0, 0) }
      100% { box-shadow: 0 0 0 0 rgba(122, 204, 0, 0) }
    }

    .st-sep {
      width: 1px;
      height: 16px;
      background: var(--ls3)
    }

    .st-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap
    }

    .st-item i {
      color: var(--ltt)
    }

    .st-item b {
      color: var(--ltp);
      font-weight: 700
    }

    .st-dim {
      color: var(--ltt)
    }

    .dash-statusbar-end {
      margin-inline-start: auto
    }

    .dash-statusbar-link {
      font-size: 12px
    }

    .widget-grid .dash-kpi-row {
      gap: 12px
    }

    .widget-grid .dash-kpi {
      background: var(--ls1);
      border: 1px solid var(--ls3);
      border-radius: var(--rmd);
      padding: 12px 15px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      transition: border-color var(--tf)

    .widget-grid .dash-kpi:hover {
      border-color: var(--lbd)

    .widget-grid .dash-kpi .lbl {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ltt)
    }

    .widget-grid .dash-kpi strong {
      font-size: 21px;
      font-weight: 800;
      line-height: 1.2
    }

    .widget-grid .dash-kpi .sub {
      font-size: 11px;
      color: var(--ltt)
    }

    .kpi-bar {
      display: block;
      width: 100%;
      height: 4px;
      border-radius: 9999px;
      background: var(--ls3);
      margin-top: 6px;
      overflow: hidden
    }

    .kpi-bar i {
      display: block;
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(270deg, var(--t500), var(--t400))

    .dash-count-chip {
      font-size: 11px;
      font-weight: 700;
      color: var(--t400);
      background: rgba(20, 143, 143, .12);
      border: 1px solid rgba(61, 181, 181, .28);
      border-radius: 9999px;
      padding: 1px 10px;
      white-space: nowrap
    }

    .dash-live-chip {
      font-size: 10.5px;
      font-weight: 800;
      color: var(--l600);
      background: rgba(122, 204, 0, .12);
      border: 1px solid rgba(122, 204, 0, .35);
      border-radius: 9999px;
      padding: 1px 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px
    }

    .dash-live-chip i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--l500);
      animation: dash-pulse 2s infinite
    }

    /* — التشغيل اليوم (attendance + classes + setup) — */
    .ops-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px
    }

    .ops-grid.has-setup {
      grid-template-columns: 1.45fr 1fr
    }

    .ops-sub {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
      font-weight: 800;
      margin-bottom: 6px
    }

    .att-list {
      display: flex;
      flex-direction: column
    }

    .att-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 7px 0;
      border-bottom: 1px solid var(--ls3)
    }

    .att-row:last-child {
      border-bottom: none
    }

    .att-av {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      flex: none;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 800;
      background: rgba(20, 143, 143, .12);
      border: 1px solid rgba(61, 181, 181, .28);
      color: var(--t400);
      text-transform: uppercase
    }

    .att-who {
      min-width: 0;
      font-size: 12.5px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .att-when {
      margin-inline-start: auto;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .att-time {
      font-size: 11.5px;
      color: var(--ltt);
      font-weight: 600
    }

    .att-method {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 9px;
      border-radius: 9999px;
      background: rgba(20, 143, 143, .12);
      border: 1px solid rgba(61, 181, 181, .28);
      color: var(--t400);
      font-size: 10.5px;
      font-weight: 700;
      white-space: nowrap
    }

    .sec-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10.5px;
      font-weight: 800;
      color: var(--ltt);
      letter-spacing: .3px;
      margin: 14px 0 8px
    }

    .sec-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--ls3)
    }

    .cls-list {
      display: flex;
      flex-direction: column
    }

    .cls-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 0
    }

    .cls-time {
      font-size: 11.5px;
      color: var(--lts);
      font-weight: 700;
      width: 46px;
      flex: none
    }

    .cls-name {
      font-size: 12px;
      font-weight: 700;
      width: 120px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .cls-bar {
      flex: 1;
      height: 6px;
      border-radius: 9999px;
      background: var(--ls3);
      overflow: hidden
    }

    .cls-bar i {
      display: block;
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(270deg, var(--t500), var(--t400))
    }

    .cls-cnt {
      font-size: 11px;
      color: var(--ltt);
      font-weight: 600;
      width: 52px;
      text-align: end
    }

    .ops-links {
      display: flex;
      gap: 16px;
      margin-top: 12px
    }

    .ops-aside:empty {
      display: none
    }

    /* — الصورة المالية: رسم + صفوف أرقام — */
    .fin-grid {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 20px
    }

    .fin-chart-col {
      min-width: 0
    }

    .fin-chart-title {
      font-size: 12.5px;
      font-weight: 800
    }

    .fin-rows {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 24px
    }

    .fin-rows .dash-exec-kpi {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--ls3);
      background: transparent;
      border-inline: 0;
      border-top: 0;
      border-radius: 0
    }

    .fin-rows .dash-exec-kpi:last-child {
      border-bottom: none
    }

    .fin-rows .dash-exec-kpi .lbl {
      font-size: 12px;
      color: var(--lts);
      font-weight: 600;
      flex: none
    }

    .fin-rows .dash-exec-kpi .val {
      margin-inline-start: auto;
      font-size: 15px;
      font-weight: 800;
      text-align: end
    }

    .fin-rows .dash-exec-kpi .sub {
      font-size: 11px;
      color: var(--ltt);
      white-space: nowrap
    }

    .fin-rows .dash-exec-kpi .hint {
      display: none
    }

    .fin-rows .dash-exec-kpi .status {
      flex-basis: 100%;
      text-align: end
    }

    .fin-details {
      border: 1px solid var(--ls3);
      border-radius: var(--rmd);
      padding: 10px 14px;
      margin-top: 14px
    }

    .fin-details summary {
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
      color: var(--lts)
    }

    .fin-details[open] summary {
      margin-bottom: 10px
    }

    /* — أعلام المتابعة (attention flags) — */
    .dash-exec-attn {
      display: flex;
      flex-wrap: wrap;
      gap: 8px
    }

    .dash-exec-attn-item {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--wrn100);
      border: 1px solid rgba(245, 158, 11, .30);
      border-radius: 9999px;
      padding: 5px 8px 5px 14px;
      font-size: 11.5px;
      color: #92400E
    }

    html[data-theme="dark"] .dash-exec-attn-item {
      background: rgba(245, 158, 11, .10);
      color: #FCD34D
    }

    .dash-exec-attn-item p {
      display: none
    }

    .dash-exec-attn-item .dash-btn.secondary {
      height: 22px;
      padding: 0 10px;
      border-radius: 9999px;
      font-size: 10.5px;
      font-weight: 800;
      background: rgba(245, 158, 11, .16);
      border-color: transparent;
      color: inherit
    }

    /* — آخر الأحداث (activity feed) — */
    .feed-list {
      display: flex;
      flex-direction: column
    }

    .feed-row {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 8px 0;
      border-bottom: 1px solid var(--ls3)
    }

    .feed-row:last-child {
      border-bottom: none
    }

    .feed-ic {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      flex: none;
      display: grid;
      place-items: center;
      background: var(--ls2);
      color: var(--ltt)
    }

    .feed-row.teal .feed-ic {
      background: rgba(20, 143, 143, .12);
      color: var(--t400)
    }

    .feed-row.warn .feed-ic {
      background: var(--wrn100);
      color: var(--wrn500)
    }

    html[data-theme="dark"] .feed-row.warn .feed-ic {
      background: rgba(245, 158, 11, .12);
      color: var(--wrn500)
    }

    .feed-now .feed-ic {
      background: rgba(122, 204, 0, .12);
      color: var(--l600)
    }

    .feed-tx {
      min-width: 0;
      font-size: 12.5px;
      line-height: 1.5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .feed-tx b {
      font-weight: 700
    }

    .feed-tx span {
      color: var(--ltt)
    }

    .feed-tm {
      margin-inline-start: auto;
      flex: none;
      font-size: 10.5px;
      color: var(--ltt);
      padding-top: 2px
    }

    .feed-now .feed-tm {
      color: var(--l600);
      font-weight: 800
    }

    [data-widget="feed"] .dash-widget-body {
      display: flex;
      flex-direction: column
    }

    [data-widget="feed"] .feed-list {
      flex: 1 1 auto
    }

    [data-widget="feed"] .dash-widget-body>.dash-link {
      margin-top: auto
    }

    /* — آخر الأحداث كشريط أفقي بعرض كامل (بدل عمود جانبي بيفضل فاضي) — */
    [data-widget="feed"] .feed-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 2px 20px
    }

    [data-widget="feed"] .feed-row .feed-tx {
      flex: 1 1 auto
    }

    /* — سطر المستحقات الهادئ (بدل كارتين بحدود تحذير) — */
    .dash-owed-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 18px;
      background: var(--ls2);
      border: 1px solid var(--ls3);
      border-radius: var(--rmd);
      padding: 10px 14px
    }

    .dash-owed-line .owed-item {
      display: inline-flex;
      align-items: center;
      gap: 8px
    }

    .dash-owed-line .lbl {
      font-size: 12px;
      font-weight: 600;
      color: var(--lts)
    }

    .dash-owed-line b {
      font-size: 15px;
      font-weight: 800
    }

    .dash-owed-line .dash-link {
      font-size: 11.5px
    }

    .dash-owed-line .owed-sep {
      width: 1px;
      height: 18px;
      background: var(--ls3)
    }

    /* — تباين الظلام: الحد الأدنى لأي نص رمادي — */
    html[data-theme="dark"] body {
      --dtt: #8C8C8C;
      --c400: #8C8C8C
    }

    /* — الإجراءات السريعة: لغة أيقونات المعاينة (محايد + لمسة ليمون) — */
    .dash-quick-item {
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 8px;
      padding: 14px 16px;
      text-align: start
    }

    .dash-quick-item .dash-quick-ico,
    .dash-quick-item.qa-member .dash-quick-ico,
    .dash-quick-item.qa-checkin .dash-quick-ico,
    .dash-quick-item.qa-sale .dash-quick-ico,
    .dash-quick-item.qa-collect .dash-quick-ico,
    .dash-quick-item.qa-trial .dash-quick-ico,
    .dash-quick-item.qa-remind .dash-quick-ico,
    .dash-quick-item.qa-shift .dash-quick-ico,
    .dash-quick-item.qa-close .dash-quick-ico,
    .dash-quick-item.qa-refund .dash-quick-ico,
    .dash-quick-item.qa-offer .dash-quick-ico,
    .dash-quick-item.qa-freeze .dash-quick-ico,
    .dash-quick-item.qa-class .dash-quick-ico {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--ls2);
      color: var(--lts)
    }

    .dash-quick-item .dash-quick-ico i {
      font-size: 18px
    }

    .dash-quick-label {
      font-size: 13px;
      font-weight: 700
    }

    .qa-sub {
      font-size: 10.5px;
      color: var(--ltt);
      line-height: 1.4
    }

    .dash-quick-item:hover .dash-quick-ico,
    .dash-quick-item.qa-member:hover .dash-quick-ico,
    .dash-quick-item.qa-sale:hover .dash-quick-ico,
    .dash-quick-item.qa-collect:hover .dash-quick-ico,
    .dash-quick-item.qa-trial:hover .dash-quick-ico,
    .dash-quick-item.qa-remind:hover .dash-quick-ico,
    .dash-quick-item.qa-shift:hover .dash-quick-ico,
    .dash-quick-item.qa-close:hover .dash-quick-ico,
    .dash-quick-item.qa-refund:hover .dash-quick-ico,
    .dash-quick-item.qa-offer:hover .dash-quick-ico,
    .dash-quick-item.qa-freeze:hover .dash-quick-ico,
    .dash-quick-item.qa-class:hover .dash-quick-ico {
      background: var(--l500);
      color: #101503
    }

    .dash-quick-item.qa-checkin {
      background: var(--l500);
      border-color: var(--l500);
      color: #101503
    }

    .dash-quick-item.qa-checkin .dash-quick-ico {
      background: rgba(16, 21, 3, .14);
      color: #101503
    }

    .dash-quick-item.qa-checkin .qa-sub {
      color: rgba(16, 21, 3, .65)
    }

    @media(hover:hover) {
      .dash-quick-item.qa-checkin:hover {
        background: var(--l400);
        border-color: var(--l400)
      }
    }

    /* — شارة تنبيهات المالية على هيدر الكارت — */
    .dash-warn-badge {
      height: 26px;
      padding: 0 12px;
      border-radius: 9999px;
      background: var(--wrn100);
      border: 1px solid rgba(245, 158, 11, .3);
      color: #92400E;
      font-size: 11.5px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap
    }

    .dash-warn-badge[hidden] {
      display: none
    }

    @media(hover:hover) {
      .dash-warn-badge:hover {
        background: rgba(245, 158, 11, .22)
      }
    }

    html[data-theme="dark"] .dash-warn-badge {
      background: rgba(245, 158, 11, .10);
      color: #FCD34D
    }

    /* — حالة «نادي جديد» في الصورة المالية — */
    .dash-empty-fin {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      padding: 42px 20px;
      color: var(--ltt)
    }

    .dash-empty-fin i {
      font-size: 30px;
      color: var(--l500)
    }

    .dash-empty-fin .big {
      font-size: 15px;
      font-weight: 800;
      color: var(--ltp)
    }

    .dash-empty-fin .sub {
      font-size: 12px;
      max-width: 52ch;
      line-height: 1.7
    }

    /* — بانر الخطأ الموحد في شريط الحالة — */
    .dash-statusbar-body.dash-error-banner {
      background: rgba(239, 68, 68, .07);
      border-color: rgba(239, 68, 68, .3)
    }

    .dash-statusbar-body.dash-error-banner i {
      color: var(--dng500)
    }

    .dash-statusbar-body.dash-error-banner b {
      color: var(--ltp)
    }

    .dash-statusbar-body.dash-error-banner .dash-btn {
      margin-inline-start: auto
    }

    /* — استجابة — */
    @media (max-width: 1023.98px) {
      .fin-grid {
        grid-template-columns: 1fr
      }

      .fin-rows {
        grid-template-columns: 1fr
      }

      .ops-grid.has-setup {
        grid-template-columns: 1fr
      }
    }

    @media (max-width: 767.98px) {
      .dash-intro {
        flex-direction: column;
        align-items: flex-start
      }

      .dash-statusbar-end {
        margin-inline-start: 0
      }
    }

    /* ============================================================
       v3 — الصورة المالية + آخر الأحداث + نظرة على النشاط
       (معاينة dashboard-operations-v3: ليمون = أزرار · تركواز = بيانات)
       ============================================================ */
    :root {
      --finv3-link: #3D7A02
    }

    html[data-theme="dark"] {
      --finv3-link: var(--l400)
    }

    /* — هيدرات كروت v3: شيب الأيقونة + الشارات جنب العنوان والرابط في الطرف — */
    [data-widget="finance"] .dash-widget-hdr,
    [data-widget="feed"] .dash-widget-hdr,
    [data-widget="business"] .dash-widget-hdr {
      justify-content: flex-start;
      flex-wrap: wrap;
      gap: 10px
    }

    .dash-widget-hdr .dash-hdr-link {
      margin-inline-start: auto;
      font-size: 12px;
      font-weight: 800;
      color: var(--finv3-link);
      white-space: nowrap;
      align-self: center
    }

    .dash-widget-hdr .dash-hdr-link:hover {
      text-decoration: underline
    }

    .dash-feed-count {
      height: 24px;
      padding: 0 10px;
      border-radius: 9999px;
      background: var(--ls2);
      border: 1px solid var(--ls3);
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 800;
      color: var(--lts);
      white-space: nowrap
    }

    .dash-feed-count[hidden] {
      display: none
    }

    [data-widget="finance"] .dash-widget-title,
    [data-widget="feed"] .dash-widget-title,
    [data-widget="business"] .dash-widget-title {
      gap: 10px
    }

    [data-widget="finance"] .dash-widget-title i,
    [data-widget="feed"] .dash-widget-title i,
    [data-widget="business"] .dash-widget-title i {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex: none
    }

    [data-widget="finance"] .dash-widget-title i {
      background: rgba(20, 143, 143, .10);
      border: 1px solid rgba(20, 143, 143, .28);
      color: var(--t600)
    }

    [data-widget="feed"] .dash-widget-title i {
      background: rgba(122, 204, 0, .12);
      border: 1px solid rgba(94, 175, 0, .35);
      color: var(--finv3-link)
    }

    [data-widget="business"] .dash-widget-title i {
      background: rgba(20, 143, 143, .10);
      border: 1px solid rgba(20, 143, 143, .28);
      color: var(--t600)
    }

    html[data-theme="dark"] [data-widget="finance"] .dash-widget-title i,
    html[data-theme="dark"] [data-widget="business"] .dash-widget-title i {
      color: var(--t400)
    }

    html[data-theme="dark"] [data-widget="feed"] .dash-widget-title i {
      color: var(--l400)
    }

    /* — شريط الفترة كبسولات داخل هيدر الكارت — */
    [data-widget="finance"] .dash-widget-hdr .dash-seg {
      margin-inline-start: auto;
      align-self: center;
      border: 1px solid var(--ls3);
      background: var(--ls2);
      border-radius: 9999px;
      padding: 3px;
      gap: 2px;
      overflow: visible
    }

    [data-widget="finance"] .dash-seg-btn {
      border-radius: 9999px;
      background: transparent;
      height: 28px;
      padding: 0 13px;
      font-size: 12px;
      font-weight: 700;
      color: var(--lts)
    }

    [data-widget="finance"] .dash-seg-btn:hover {
      background: var(--ls3);
      color: var(--ltp)
    }

    [data-widget="finance"] .dash-seg-btn.act {
      background: var(--l500);
      color: #101503;
      box-shadow: 0 2px 8px rgba(122, 204, 0, .25)
    }

    .dash-custom-range[hidden] {
      display: none
    }

    /* — شريط المؤشرات المالية — */
    .finv3-hero {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 1fr;
      padding: 16px 20px 14px
    }

    .finv3-cell {
      padding: 2px 18px;
      border-inline-start: 1px solid var(--ls3);
      min-width: 0
    }

    .finv3-cell:first-child {
      padding-inline-start: 0;
      border-inline-start: none
    }

    .finv3-hero .lbl {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ltt);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden
    }

    .finv3-hero .lbl i {
      font-size: 14px;
      flex: none
    }

    .finv3-hero .val {
      font-size: 19px;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: .2px
    }

    .finv3-cell.is-main .val {
      font-size: 30px
    }

    .finv3-hero .val .na {
      font-size: 15px;
      font-weight: 700;
      color: var(--ltt)
    }

    .finv3-hero .sub {
      font-size: 11px;
      color: var(--ltt);
      margin-top: 3px;
      line-height: 1.5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .finv3-hero .dot,
    .finv3-attn .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-inline-end: 5px;
      vertical-align: 1px;
      background: #E0A422
    }

    /* — الرسم + العمود الجانبي — */
    .finv3-grid {
      display: grid;
      grid-template-columns: 2.1fr 1fr;
      border-top: 1px solid var(--ls3)
    }

    .finv3-chart {
      padding: 16px 20px 14px;
      border-inline-end: 1px solid var(--ls3);
      min-width: 0
    }

    .finv3-aside {
      padding: 16px 20px 14px;
      min-width: 0
    }

    .finv3-block-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 800;
      color: var(--ltp);
      margin-bottom: 10px
    }

    .finv3-block-title i {
      color: var(--t600);
      font-size: 15px
    }

    html[data-theme="dark"] .finv3-block-title i {
      color: var(--t400)
    }

    .finv3-more {
      margin-inline-start: auto;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--finv3-link)
    }

    .finv3-more:hover {
      text-decoration: underline
    }

    .finv3-chart-wrap {
      width: 100%;
      overflow: hidden
    }

    .finv3-chart-wrap svg {
      display: block;
      max-width: 100%
    }

    .finv3-chart-note {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--ltt);
      margin-top: 8px
    }

    .finv3-chart-note i {
      font-size: 13px;
      flex: none
    }

    /* — المستحقات: صفوف هادية، الأصفار رمادية — */
    .finv3-owed-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 0
    }

    .finv3-owed-row+.finv3-owed-row {
      border-top: 1px dashed var(--ls3)
    }

    .finv3-owed-row .lbl {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--lts);
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .finv3-owed-row .v {
      margin-inline-start: auto;
      font-size: 14px;
      font-weight: 800;
      flex: none
    }

    .finv3-owed-row .v.zero {
      color: var(--ltt);
      font-weight: 700
    }

    .finv3-owed-row a {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--finv3-link);
      white-space: nowrap;
      flex: none
    }

    .finv3-owed-row a:hover {
      text-decoration: underline
    }

    .finv3-owed-note {
      font-size: 10.5px;
      color: var(--ltt);
      margin: 2px 0 0
    }

    /* — روابط التقارير الجانبية — */
    .finv3-qlinks {
      margin-top: 14px;
      border-top: 1px solid var(--ls3);
      padding-top: 10px
    }

    .finv3-ql {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 8px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--lts)
    }

    .finv3-ql i {
      color: var(--ltt);
      font-size: 15px
    }

    .finv3-ql .chev {
      margin-inline-start: auto;
      font-size: 13px;
      opacity: .7
    }

    .finv3-ql:hover {
      background: var(--ls2);
      color: var(--ltp)
    }

    .finv3-ql:hover i:first-child {
      color: var(--t600)
    }

    html[data-theme="dark"] .finv3-ql:hover i:first-child {
      color: var(--t400)
    }

    /* — بحاجة متابعة: صفوف كهرماني بحافة جانبية رفيعة — */
    .finv3-attn {
      border-top: 1px solid var(--ls3);
      padding: 14px 20px 8px
    }

    .finv3-attn-rows {
      display: grid;
      gap: 10px
    }

    .finv3-attn-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--wrn100);
      border: 1px solid rgba(245, 158, 11, .30);
      border-inline-start: 3px solid #E0A422;
      border-radius: var(--rmd);
      padding: 9px 14px
    }

    html[data-theme="dark"] .finv3-attn-row {
      background: rgba(245, 158, 11, .10);
      border-inline-start-color: #D97706
    }

    .finv3-attn-row>i {
      color: #B45309;
      font-size: 16px;
      flex: none
    }

    html[data-theme="dark"] .finv3-attn-row>i {
      color: #FCD34D
    }

    .finv3-attn-row .tx {
      min-width: 0;
      flex: 1
    }

    .finv3-attn-row .tx b {
      display: block;
      font-size: 12.5px;
      font-weight: 800;
      color: var(--ltp)
    }

    .finv3-attn-row .tx span {
      display: block;
      font-size: 11.5px;
      color: var(--lts);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .finv3-attn-row .go {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 800;
      color: var(--finv3-link);
      white-space: nowrap;
      flex: none
    }

    .finv3-attn-row .go:hover {
      text-decoration: underline
    }

    .finv3-attn-empty {
      font-size: 12px;
      color: var(--ltt)
    }

    .finv3-attn-note {
      font-size: 11px;
      color: var(--ltt);
      background: var(--ls2);
      border: 1px solid var(--ls3);
      border-radius: var(--rsm);
      padding: 6px 12px;
      margin-top: 10px
    }

    /* — حالة فشل تحميل الفترة: الخطأ مختصر والفلاتر فوقه شغالة — */
    .finv3-err {
      margin: 14px 20px 18px
    }

    /* — تفاصيل مطوية: تفصيل الربحية + المسرد في صف واحد — */
    .finv3-foot {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      border-top: 1px solid var(--ls3);
      padding: 12px 20px 16px
    }

    .finv3-details {
      background: var(--ls2);
      border: 1px solid var(--ls3);
      border-radius: var(--rmd);
      overflow: hidden
    }

    .finv3-details summary {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      font-size: 12.5px;
      font-weight: 800;
      color: var(--lts);
      cursor: pointer
    }

    .finv3-details summary::-webkit-details-marker {
      display: none
    }

    .finv3-details summary i {
      margin-inline-start: auto;
      color: var(--ltt);
      font-size: 14px;
      transition: transform var(--tf)
    }

    .finv3-details[open] summary i {
      transform: rotate(180deg)
    }

    .finv3-details[open] {
      background: var(--ls1)
    }

    .finv3-dbody {
      padding: 2px 14px 12px;
      font-size: 12px;
      color: var(--lts)
    }

    /* — آخر الأحداث: جدول ثابت الأعمدة بدل شبكة مبعثرة — */
    [data-widget="feed"] .feed-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      flex: 1 1 auto
    }

    [data-widget="feed"] .feed-row {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) auto 64px;
      align-items: center;
      gap: 12px;
      padding: 9px 20px
    }

    [data-widget="feed"] .feed-row+.feed-row {
      border-top: 1px solid var(--ls3);
      border-bottom: none
    }

    @media(hover:hover) {
      [data-widget="feed"] .feed-row:hover {
        background: var(--ls2)
      }
    }

    .feed-ic.k-checkin {
      background: rgba(20, 143, 143, .12);
      color: var(--t600)
    }

    html[data-theme="dark"] .feed-ic.k-checkin {
      color: var(--t400)
    }

    .feed-ic.k-sale {
      background: rgba(122, 204, 0, .13);
      color: var(--finv3-link)
    }

    html[data-theme="dark"] .feed-ic.k-sale {
      color: var(--l400)
    }

    .feed-ic.k-expense {
      background: var(--wrn100);
      color: #B45309
    }

    html[data-theme="dark"] .feed-ic.k-expense {
      background: rgba(245, 158, 11, .12);
      color: var(--wrn500)
    }

    .feed-ic.k-shift {
      background: var(--ls3);
      color: var(--lts)
    }

    .feed-row.feed-now {
      background: rgba(122, 204, 0, .10)
    }

    .feed-row.feed-now .feed-ic {
      background: var(--l500);
      color: #101503
    }

    .feed-row.feed-now .feed-tm {
      color: var(--finv3-link);
      font-weight: 800
    }

    .feed-amt {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--ltp);
      text-align: end;
      flex: none
    }

    .feed-amt:empty {
      display: none
    }

    .feed-amt.zero {
      color: var(--ltt);
      font-weight: 600
    }

    [data-widget="feed"] .feed-tm {
      text-align: end
    }

    /* — نظرة على النشاط: شريط ٥ إحصائيات بفواصل — */
    .finv3-act {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 6px 8px
    }

    .finv3-act .act-cell {
      padding: 12px 18px;
      border-inline-start: 1px solid var(--ls3);
      min-width: 0
    }

    .finv3-act .act-cell:first-child {
      border-inline-start: none
    }

    .finv3-act .lbl {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--ltt);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden
    }

    .finv3-act .lbl i {
      color: var(--t600);
      font-size: 13px;
      flex: none
    }

    html[data-theme="dark"] .finv3-act .lbl i {
      color: var(--t400)
    }

    .finv3-act .val {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.25
    }

    .finv3-act .val.zero {
      color: var(--ltt)
    }

    /* — استجابة v3 — */
    @media (max-width: 1180px) {
      .finv3-hero {
        grid-template-columns: 1fr 1fr;
        row-gap: 14px
      }

      .finv3-cell {
        border-inline-start: none;
        padding-inline: 0
      }

      .finv3-grid {
        grid-template-columns: 1fr
      }

      .finv3-chart {
        border-inline-end: none;
        border-bottom: 1px solid var(--ls3)
      }

      .finv3-act {
        grid-template-columns: repeat(3, 1fr);
        row-gap: 8px
      }

      .finv3-act .act-cell {
        border-inline-start: none
      }

      .finv3-foot {
        grid-template-columns: 1fr
      }
    }

    @media (max-width: 767.98px) {
      .finv3-hero {
        grid-template-columns: 1fr
      }

      .finv3-act {
        grid-template-columns: 1fr 1fr
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sb-hdr">
        <svg viewBox="0 0 148 167" fill="none"><path fill="#7ACC00" d="M38 0H0V139L79 58H38Z"/>
          <path fill="#7ACC00" d="M148 23L68 105H112V167H148Z"/></svg>
        <span>HyMotion</span>
      </div>
      <nav class="sb-nav">
        <!-- Replaced at runtime by GfpShell from useVisibleNav() -->
        <a class="sb-item act" href="/dashboard/"><i class="ti ti-layout-dashboard"></i>Dashboard</a>
      </nav>
      <div class="sb-ft">
        <div class="av-sm" id="userAvatar">—</div>
        <div class="sb-ft-info">
          <div class="sb-ft-name" id="userName">User</div>
          <div class="sb-ft-role" id="userRole">Staff</div>
        </div>
        <button class="sb-logout" id="btnLogout" title="Logout"><i class="ti ti-logout"></i></button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="tb-left">
          <button class="mob-toggle" id="mobToggle" type="button"><i class="ti ti-menu-2"></i></button>
          <div class="tb-breadcrumb" data-en="Dashboard" data-ar="لوحة التحكم">Dashboard</div>
        </div>
        <div class="tb-right">
          <div>
            <div class="tb-gym-name" id="gymName">HyMotion</div>
            <div class="tb-gym-name-ar" id="gymNameAr"></div>
          </div>
        </div>
      </header>

      <div class="content">
        <div class="dash-intro">
          <div>
            <div class="dash-eyebrow">Gym operations</div>
            <h1 id="dashboardHeadline">Your gym dashboard</h1>
            <p id="dashboardSubtitle">What is happening in your gym today, and what needs attention?</p>
          </div>
          <div class="dash-intro-end">
            <span class="dash-intro-meta">Live data · Cairo calendar day</span>
            <div class="dash-intro-cta" id="dashHeadCta"></div>
          </div>
        </div>
        <div class="widget-grid" id="widgetGrid" aria-live="polite">
          <div class="dash-widget" style="grid-column:span 12">
            <div class="dash-muted">Loading widgets…</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/shared/quick-actions.js?v=6"></script>
  <script src="/dashboard/dashboard-home.js?v=dash9"></script>
</body>
